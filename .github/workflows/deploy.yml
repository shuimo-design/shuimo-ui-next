# 演练场（组件文档）发布到 Vercel：https://shuimo-ui-next.vercel.app
# 走 Vercel CLI 而不是 Vercel 的 GitHub 集成：那个集成装在 shuimo-design 组织上，
# 授权仓库列表要组织管理员才能改，这里用仓库自己的 VERCEL_TOKEN 就够了。
# 构建在 Vercel 那边跑，命令与产物目录读仓库根的 vercel.json。
# ORG / PROJECT 是项目标识不是密钥（Vercel 自己也把它们写进 .vercel/project.json）。
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  vercel:
    runs-on: ubuntu-latest
    env:
      # secrets 不能在 if 条件里直接读，先落到 env 再判断：没配令牌就跳过，不留一片红叉
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_qkXdbydEo9n10JwfliniIkmo
      VERCEL_PROJECT_ID: prj_8a8oV0aDR4qYuj1ZlabeuNIiQyL6
    steps:
      - uses: actions/checkout@v5
      - if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "::warning::未配置 VERCEL_TOKEN，跳过部署"
      - if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel@latest deploy --prod --yes
