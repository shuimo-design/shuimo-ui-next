# changesets 发版。默认**不跑**：仓库变量 RELEASE_ENABLED 不是 "true" 时整个任务跳过。
#
# 为什么要这个开关：shuimo-design 组织有一个组织级的 NPM_TOKEN，本仓库自动继承，
# 所以「有没有配令牌」判不出来；而 npm 上 @shuimo-design 这个 scope 还不存在，
# changesets 每次推 main 都会去发 @shuimo-design/ui@0.0.0，必然 404，把 main 刷成一片红。
#
# 准备好首发时：先在 npm 上建 @shuimo-design 组织、确认那个令牌有该 scope 的发布权，
# 再把变量打开 —— gh variable set RELEASE_ENABLED --body true --repo shuimo-design/shuimo-ui-next
name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # 没用 changesets/action@v1：它内置的是旧版读取逻辑，而本仓库用的是 @changesets/cli 3.x，
      # 预发布模式会把消费掉的 changeset 挪进 .changeset/pre/ 目录；旧逻辑把这个目录当成
      # 老格式的 changeset，去找里面并不存在的 changes.md 然后崩掉（实测 ENOENT）。
      # 直接用仓库自己的 CLI 发布，代价是暂时没有自动的 Version PR 和 GitHub Release。
      # 注意写 pnpm run：pnpm 自带 version 子命令会把 pnpm version 截胡。
      - run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # changeset publish 会在本地打 tag，推上去
      - run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
