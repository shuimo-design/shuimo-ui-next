# changesets 发版。默认**不跑**：仓库变量 RELEASE_ENABLED 不是 "true" 时整个任务跳过。
#
# 为什么要这个开关：shuimo-design 组织有一个组织级的 NPM_TOKEN，本仓库自动继承，
# 所以「有没有配令牌」判不出来；而 npm 上 @shuimo-design 这个 scope 还不存在，
# changesets 每次推 main 都会去发 @shuimo-design/ui@0.0.0，必然 404，把 main 刷成一片红。
#
# 准备好首发时：先在 npm 上建 @shuimo-design 组织、确认那个令牌有该 scope 的发布权，
# 再把变量打开 —— gh variable set RELEASE_ENABLED --body true --repo shuimo-design/shuimo-ui-next
name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
