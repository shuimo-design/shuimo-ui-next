# changesets 发版。没配 NPM_TOKEN 时整个任务跳过：
# 否则每次推 main 都会去发当前版本，registry 上没有这个包就报 404，把 main 刷成一片红。
# 真要发版时在仓库里配上 NPM_TOKEN（scope @shuimo-design 要先在 npm 上建好）。
name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    # secrets 在 if 条件里读不到，先落到 job 的 env 上
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::未配置 NPM_TOKEN，跳过发版"
      - if: ${{ env.NPM_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
